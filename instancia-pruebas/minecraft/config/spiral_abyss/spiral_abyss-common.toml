#Reduce a player's damage to floor 5/6 bosses by 60% until they defeat that species outside the Abyss.
#Preserves normal boss progression. Disable for packs that intentionally allow Abyss-first boss encounters.
abyssal_rejection = true
#Server-wide reset interval in real-world days, including server downtime.
#0 disables automatic resets. Personal resets never change this schedule or the cycle's mob choices.
# Default: 20
# Range: 0 ~ 36500
reset_days = 20
#False: pick one entity ID per category per wave and repeat it for the count.
#True: pick an entity ID independently for every spawn, including across mods.
mix_mobs = false
#Entity IDs excluded from all Abyss wave selections, including bosses and mini-bosses in normal and Endless modes.
#Example: ["minecraft:wither", "annoyingvillagers:herobrine_clone"]. Empty allows all configured mobs.
mob_blacklist = []
#Announce successful pickups of rare gold-trail Abyss rewards to every online player.
broadcast_rare_loot = true
#Base rare reward probability per eligible player and mob-linked item roll in a Golden Chest.
# Default: 0.05
# Range: 0.0 ~ 1.0
rare_reward_chance = 0.05
