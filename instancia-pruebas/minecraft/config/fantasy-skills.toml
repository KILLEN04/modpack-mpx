#The format of this file. The mod keeps it up to date, carrying your settings over when an update renames or moves one. Leave it as it is.
# Default: 2
# Range: > 1
configVersion = 2

#Every skill of every mount. Each dial in this file multiplies what a skill adds (its stat raises and ability bonuses): 1.0 = as shipped, 0.5 = half as strong, 2.0 = twice, 0 = nothing. A skill's strength is this dial times its mount's allSkills times its own dial. Skill costs, ranks and unlock levels are set in data packs (fantasy_skill_tree); skill points per level and the level cap are in fantasy-balance.toml.
[global]
	#Every skill of every mount.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	strength = 1.0

