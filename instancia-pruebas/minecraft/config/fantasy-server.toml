	#Settings for the kitsune.
	[mounts.kitsune]
		#If false, this mount can't be spawned, tamed or ridden and doesn't spawn naturally.
		enabled = true
		#Allow natural spawns in the wild.
		wildSpawns = true
		#Cap on riders (0 = as many seats as the mount has).
		# Default: 0
		# Range: 0 ~ 8
		maxRiders = 0
		#Allow breeding.
		allowBreeding = true
		#Ability ids to switch off for this mount, e.g. ["fantasy:frost_walk"].
		disabledAbilities = []

